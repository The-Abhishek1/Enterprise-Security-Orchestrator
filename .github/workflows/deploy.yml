name: Deploy ESO to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/Enterprise-Security-Orchestrator
            git pull origin main
            ./venv/bin/pip install -r requirements.txt -q
            systemctl restart eso
            sleep 3
            systemctl status eso --no-pager | tail -5