name: Feature Request
description: Suggest a new feature
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want?
      description: Describe the feature
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why?
      description: What problem does this solve?
  - type: dropdown
    attributes:
      label: Category
      options:
        - New security tool
        - Result parser improvement
        - Report format
        - API feature
        - UI/UX
        - Performance
        - Other
